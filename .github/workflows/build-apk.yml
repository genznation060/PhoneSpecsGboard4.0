name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PhoneSpecsGboard-Updated.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP exists
        run: |
          ls -lh PhoneSpecsGboard-Updated.zip || (echo "ZIP missing!" && exit 1)

      - name: Extract Android project
        run: unzip -o PhoneSpecsGboard-Updated.zip -d project

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK commandline tools
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        working-directory: project/PhoneSpecsGboard-Updated
        env:
          ANDROID_HOME: ${{ runner.temp }}/../../android-sdk
        run: |
          # Fix ANDROID_HOME path
          export ANDROID_HOME=$HOME/android-sdk
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Install Gradle
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip -d $HOME/gradle
          export PATH=$HOME/gradle/gradle-8.2/bin:$PATH
          
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneSpecsGboard-Updated-APK
          path: project/PhoneSpecsGboard/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
