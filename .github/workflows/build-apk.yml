name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip -d $HOME/gradle
          echo "$HOME/gradle/gradle-9.3.1/bin" >> $GITHUB_PATH

      - name: Create Dummy .env
        run: |
          echo "GEMINI_API_KEY=dummy_key_for_build" > .env

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpecBoard-APK
          path: app/build/outputs/apk/debug/app-debug.apk
