name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'PhoneSpecsGboard-Updated.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check ZIP exists
        run: |
          if [ ! -f "PhoneSpecsGboard-AndroidProject.zip" ]; then
            echo "ERROR: PhoneSpecsGboard-AndroidProject.zip not found!"
            ls -la
            exit 1
          fi
          ls -lh PhoneSpecsGboard-AndroidProject.zip

      - name: Extract Android project
        run: |
          unzip -o PhoneSpecsGboard-AndroidProject.zip -d project
          echo "=== Extracted structure ==="
          find project -maxdepth 3

      - name: Detect project directory
        id: project
        run: |
          if [ -d "project/PhoneSpecsGboard" ]; then
            echo "dir=project/PhoneSpecsGboard" >> $GITHUB_OUTPUT
            echo "Found: project/PhoneSpecsGboard"
          elif [ -f "project/settings.gradle" ] || [ -f "project/settings.gradle.kts" ]; then
            echo "dir=project" >> $GITHUB_OUTPUT
            echo "Found: project (root)"
          else
            echo "ERROR: Cannot find Android project"
            find project
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK
        run: |
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          
          export ANDROID_HOME=$HOME/android-sdk
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          
          # Install Gradle
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip -d $HOME/gradle
          export PATH=$HOME/gradle/gradle-8.2/bin:$PATH
          
          echo "Building from: $(pwd)"
          ls -la
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneSpecsGboard-APK
          path: |
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
